/* Layout: sidebar ledger on desktop, bottom tab bar on phone. Teal = money in, amber = money out. */
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --surface2:#E3E8EA; --ink:#12202A; --muted:#566772; --line:#D2D9DD;
  --accent:#0A7771; --accent-ink:#FFFFFF; --amber:#B9680F; --neg:#B53A31; --pos:#0A7771; --shade:rgba(18,32,42,.45);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#141E24; --surface2:#1C2A31; --ink:#E5EDF0; --muted:#8EA2AD; --line:#26353E;
  --accent:#3DC5BC; --accent-ink:#06211F; --amber:#EBA251; --neg:#F27A71; --pos:#3DC5BC; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141E24; --surface2:#1C2A31; --ink:#E5EDF0; --muted:#8EA2AD; --line:#26353E;
  --accent:#3DC5BC; --accent-ink:#06211F; --amber:#EBA251; --neg:#F27A71; --pos:#3DC5BC; --shade:rgba(0,0,0,.6); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em;line-height:1}
.brand span{color:var(--muted);font-size:12.5px}
.twin{display:inline-flex;margin-right:8px;vertical-align:-3px}
.twin i{width:12px;height:20px;border-radius:3px;background:var(--accent)}
.twin i+i{background:var(--amber);margin-left:-3px;transform:translateY(3px)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:block}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.status{margin-top:auto;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
.dot.warn{background:var(--amber)} .dot.bad{background:var(--neg)}
main{padding:28px 24px 48px;min-width:0;display:flex;flex-direction:column;gap:24px;max-width:1120px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:18px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel>h2{margin-bottom:12px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:16px}
.profit{background:var(--ink);color:var(--bg);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px;justify-content:space-between;min-width:0}
.profit .lab{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.profit .big{font-family:var(--f-mono);font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
.profit .note{font-size:13px;opacity:.75}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .lab{color:var(--muted);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.kpi .val{font-family:var(--f-mono);font-size:20px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.kpi .hint{font-size:12.5px;color:var(--muted);margin-top:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
td.wrap{min-width:160px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.t-charge{color:var(--amber);border-color:var(--amber)}
.tag.t-versement,.tag.t-remboursement{color:var(--pos);border-color:var(--pos)}
.tag.t-emprunt{color:var(--neg);border-color:var(--neg)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{min-width:0;flex:1 1 140px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.sum{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.admin h2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bal{font-family:var(--f-mono);font-size:22px;font-weight:600;margin:6px 0 2px;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px;color:var(--muted);margin:12px 0}
.mini b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
details{margin-top:8px} summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:8px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .b1{fill:var(--accent)} svg.chart .b2{fill:var(--amber)}
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:480px;padding:20px;margin-block:auto;display:flex;flex-direction:column;gap:14px}
.modal form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.chk input{width:auto}
.err{color:var(--neg);font-size:13.5px;min-height:0}
.info{font-size:13.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:10px 12px}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
input[type=color]{padding:2px;height:38px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.banner{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
  .side .brand,.side .status{display:none}
  .nav{flex-direction:row;width:100%}
  .nav button{flex:1 1 0;min-width:0;text-align:center;padding:9px 2px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:20px 16px 96px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  h1{font-size:26px}
  .topbar{display:flex!important}
}
.topbar{display:none;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-display);font-size:18px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s,border-color .15s}}

function calc(){
  var c={rev:0,capital:0,txExp:0,charges:0,cash:0,bySec:{},byMonth:{},bal:{}};
  function sec(id){return c.bySec[id]||(c.bySec[id]={rev:0,cost:0})}
  function mon(k){return c.byMonth[k]||(c.byMonth[k]={rev:0,cost:0})}
  S.transactions.forEach(function(t){
    if(t.type==='revenu'){c.cash+=t.amount;if(t.capital){c.capital+=t.amount;return}
      c.rev+=t.amount;sec(t.sectionId).rev+=t.amount;mon(mkey(t.date)).rev+=t.amount}
    else{c.cash-=t.amount;c.txExp+=t.amount;sec(t.sectionId).cost+=t.amount;mon(mkey(t.date)).cost+=t.amount}
  });
  S.admins.forEach(function(a){c.bal[a.id]={charge:0,emprunt:0,versement:0,remboursement:0,net:0}});
  S.adminOps.forEach(function(o){

    if(o.type==='charge'){c.charges+=o.amount;sec(opSection(o)).cost+=o.amount;mon(mkey(o.date)).cost+=o.amount}
    else if(o.type==='versement')c.cash+=o.amount;
    else c.cash-=o.amount;
  });
  S.admins.forEach(function(a){var b=c.bal[a.id];b.net=b.charge+b.versement-b.emprunt-b.remboursement});
  c.cost=c.txExp+c.charges;c.profit=c.rev-c.cost;
  return c;
}

  var o=modal(s?'Modifier la section':'Nouvelle section',fld('Nom',0,inp('name','text',d.name,'required'))+'<div class="fld2">'+fld('Type',0,sel('type',[['produit','Produit'],['campagne','Campagne'],['global','Global']],d.type))+fld('Couleur',0,inp('color','color',d.color))+'</div>'+(used?'<div class="info">Cette section contient des lignes ou représente le niveau global : elle ne peut pas être supprimée.</div>':''),function(fd){
    var n=String(fd.get('name')).trim();if(!n)return 'Saisissez un nom.';
    if(s){s.name=n;s.type=fd.get('type');s.color=fd.get('color')}else S.sections.push({id:uid('sec'),name:n,type:fd.get('type'),color:fd.get('color')})},s&&!used?delBtn():'');
  if(s&&!used)armDel(o,function(){S.sections.splice(S.sections.indexOf(s),1)});
}
function catForm(id){
  var c=id?by(S.categories,id):null,d=c||{name:'',type:'depense'};
  var used=c&&(S.transactions.some(function(t){return t.categoryId===c.id})||S.receptions.some(function(r){return r.categoryId===c.id}));
  var o=modal(c?'Modifier la catégorie':'Nouvelle catégorie',fld('Nom',0,inp('name','text',d.name,'required'))+fld('Type',0,sel('type',[['revenu','Revenu'],['depense','Dépense']],d.type,c&&used?'disabled':''))+(used?'<div class="info">Cette catégorie est utilisée : elle ne peut pas être supprimée.</div>':''),function(fd){
    var n=String(fd.get('name')).trim();if(!n)return 'Saisissez un nom.';
    if(c){c.name=n;if(!used)c.type=fd.get('type')}else S.categories.push({id:uid('cat'),name:n,type:fd.get('type')})},c&&!used?delBtn():'');
  if(c&&!used)armDel(o,function(){S.categories.splice(S.categories.indexOf(c),1)});
}

/* ---------- events ---------- */
var A={
  tab:function(b){ui.tab=b.dataset.t;try{localStorage.setItem('tt_tab',ui.tab)}catch(e){}render();window.scrollTo(0,0)},
  newTx:function(){txForm()},editTx:function(b){txForm(b.dataset.id)},
  newRec:function(){recForm()},editRec:function(b){recForm(b.dataset.id)},
  newOp:function(b){opForm(null,b.dataset.id)},editOp:function(b){opForm(b.dataset.id)},
  newAdmin:function(){adminForm()},editAdmin:function(b){adminForm(b.dataset.id)},
  newSec:function(){secForm()},editSec:function(b){secForm(b.dataset.id)},
  newCat:function(){catForm()},editCat:function(b){catForm(b.dataset.id)},
  mclose:closeModal,
  setCur:function(){var v=$('#cur').value.trim();if(v){S.currency=v;save();render()}},
  export:function(){
    var out=JSON.parse(JSON.stringify(S));delete out.meta;
    dl.save({filename:'tech-twins-'+today()+'.json',data:JSON.stringify(out,null,2)}).catch(function(){});
  }
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var f=A[b.dataset.a];if(f){e.preventDefault();f(b)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
document.addEventListener('input',function(e){
  if(e.target.id==='fq'){ui.f.q=e.target.value;txList()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='fsec'){ui.f.sec=e.target.value;txList()}
  else if(id==='ftype'){ui.f.type=e.target.value;txList()}
  else if(id==='fmonth'){ui.f.month=e.target.value;txList()}
  else if(id==='rsec'){ui.rsec=e.target.value;render()}
  else if(id==='imp'){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var rd=new FileReader();rd.onload=function(){
      var msg=$('#impmsg');
      try{var j=JSON.parse(rd.result);if(!j||!Array.isArray(j.transactions)||!Array.isArray(j.sections))throw 0;
        var o=modal('Remplacer toutes les données ?','<div class="info">Le fichier contient '+j.transactions.length+' transactions, '+(j.receptions||[]).length+' réceptions et '+(j.adminOps||[]).length+' opérations d’associés. Les données actuelles seront remplacées.</div>',function(){
          var rev=S.meta.rev||0;['categories','transactions','cashDays','clients','clientOps','admins','adminOps','receptions','supplierPayments','orders','testPhones'].forEach(function(k){if(!Array.isArray(j[k]))j[k]=[]});
          j.currency=j.currency||'DA';S=j;S.meta={rev:rev};});
        $('.btn.pri',o).textContent='Remplacer';
      }catch(x){if(msg)msg.textContent='Ce fichier n’est pas une sauvegarde valide.'}
    };rd.readAsText(file);e.target.value='';
  }
});

// ==========================================
// SYNCHRONISATION EN TEMPS RÉEL DEPUIS FIREBASE
// ==========================================
docRef.onSnapshot(function(doc) {
  if (doc.exists) {
    var cloudData = doc.data();
    // Si les données du cloud sont plus récentes que celles affichées
    if (cloudData.meta && cloudData.meta.rev > (S.meta.rev || 0)) {
      S = cloudData;
      try{localStorage.setItem('tt_state', JSON.stringify(S));}catch(e){}
      render(); // Rafraîchit l'interface automatiquement
      console.log("Données synchronisées depuis le cloud.");
    }
  } else {
    // Si le document n'existe pas encore dans le cloud, on l'y crée
    docRef.set(S);
  }
});
// ==========================================

render();
})();
</script></body></html>
